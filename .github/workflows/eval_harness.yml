name: Agentic AI Eval Harness Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  eval-harness-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest fastapi httpx uvicorn pydantic deepeval openai

      - name: Execute API Integration Test Suite
        run: |
          pytest tests/test_api.py -v

      - name: Execute Zhaluzi Agent Eval Harness
        run: |
          pytest eval/test_zhaluzi_agent.py -v
